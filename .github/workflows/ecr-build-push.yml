name: Build and Push Images to ECR

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pb/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecr-build-push
  cancel-in-progress: false

jobs:
  services:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Define application services
        id: list
        run: |
          echo 'list=["accounting","ad","agent","cart","chatbot","checkout","currency","email","flagd-ui","fraud-detection","frontend","frontend-proxy","image-provider","kafka","load-generator","mcp","opamp-server","opensearch","payment","product-catalog","quote","recommendation","shipping","telemetry-docs"]' >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: services
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}

    env:
      IMAGE: ecommerce/${{ matrix.service }}
      DOCKERFILE: ${{ matrix.service == 'cart' && 'src/cart/src/Dockerfile' || format('src/{0}/Dockerfile', matrix.service) }}
      OTEL_JAVA_AGENT_VERSION: '2.31.1'
      OPENTELEMETRY_CPP_VERSION: '1.28.0'
      OPAMP_GO_REF: '40c117bcec97130c236fc4b9aabc3a1a5e514c50'

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Download Tailwind Linux binary for flagd-ui
        if: matrix.service == 'flagd-ui'
        run: |
          curl --fail --location --retry 3 \
            --output tailwindcss-linux-x64 \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.0.9/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          test -s tailwindcss-linux-x64


      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to private Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
          aws-region: us-east-1

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories --repository-names "$IMAGE" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$IMAGE" \
            --image-scanning-configuration scanOnPush=true

      - name: Free disk space
        run: |
          df -h /
          docker builder prune -af || true
          docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          push: true
          build-args: |
            OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
            OPENTELEMETRY_CPP_VERSION=${{ env.OPENTELEMETRY_CPP_VERSION }}
            OPAMP_GO_REF=${{ env.OPAMP_GO_REF }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}:${{ github.run_number }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}:latest


  update-k8s-manifests:
    name: Update Kubernetes image tags
    needs: [services, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v7
        with:
          repository: stancloud9/ecommerce-k8s-files-dw
          ref: main
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: k8s-manifests

      - name: Update all 24 application image tags
        working-directory: k8s-manifests
        env:
          TAG: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          tag = os.environ["TAG"]
          files = [
              Path("10-ecommerce-data/kustomization.yaml"),
              Path("20-logging/kustomization.yaml"),
              Path("30-observability/kustomization.yaml"),
              Path("40-ecommerce-app/kustomization.yaml"),
              Path("50-ai-assistant/kustomization.yaml"),
          ]

          pattern = re.compile(
              r'(?m)^([ \t]*-[ \t]+name:[ \t]+'
              r'910965283770\.dkr\.ecr\.us-east-2\.amazonaws\.com/ecommerce/[^\s]+'
              r'\r?\n[ \t]+newTag:[ \t]*)"?([^"\r\n]+)"?'
          )

          total = 0

          for file in files:
              if not file.is_file():
                  raise SystemExit(f"Missing Kustomize file: {file}")

              content = file.read_text()
              updated, count = pattern.subn(
                  lambda match: f'{match.group(1)}"{tag}"',
                  content
              )

              file.write_text(updated)
              total += count
              print(f"{file}: updated {count} image tags")

          if total != 24:
              raise SystemExit(
                  f"Expected exactly 24 image mappings, found {total}. "
                  "Stopping without committing."
              )

          print(f"Successfully updated all {total} image tags to {tag}.")
          PY

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Validate Kubernetes manifests
        working-directory: k8s-manifests
        run: |
          kubectl kustomize 40-ecommerce-app >/dev/null
          kubectl kustomize 10-ecommerce-data >/dev/null
          kubectl kustomize 20-logging >/dev/null
          kubectl kustomize 30-observability >/dev/null
          kubectl kustomize 50-ai-assistant >/dev/null

      - name: Commit and push updated manifests
        working-directory: k8s-manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 10-ecommerce-data/kustomization.yaml \
                  20-logging/kustomization.yaml \
                  30-observability/kustomization.yaml \
                  40-ecommerce-app/kustomization.yaml \
                  50-ai-assistant/kustomization.yaml

          git commit -m "Deploy application images from build #${GITHUB_RUN_NUMBER}"
          git push origin main
